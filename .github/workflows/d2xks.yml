name: Build ArtisanROM

on:
  workflow_dispatch:
  push:
    branches:
      - d2xks-reproducible-sixteen-clean

permissions:
  contents: write

concurrency:
  group: d2xks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [d2xks]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a --force

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: compiler_cmake

      - name: Restore firmware downloads
        id: firmware-cache
        uses: actions/cache/restore@v6
        with:
          path: out/odin
          key: d2xks-odin-v1-${{ hashFiles('target/d2xks/config.sh', 'unica/configs/essi.sh') }}

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu python-is-python3 python3 wget
          wget -q https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py
          sudo install -m 0755 mkbootimg.py /usr/local/bin/mkbootimg
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh ${{ matrix.target }} && ./scripts/download_fw.sh

      - name: Save firmware downloads
        if: success() && steps.firmware-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: out/odin
          key: d2xks-odin-v1-${{ hashFiles('target/d2xks/config.sh', 'unica/configs/essi.sh') }}

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh
          ./scripts/internal/validate_prebuilt_resources.sh ${{ matrix.target }}

      - name: Add swapspace
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-space-path: /swapfile
          swap-size-gb: 12
          remove-existing-swap-files: true

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Find ZIP file
        id: find_zip
        run: |
          ZIP_FILE=$(find out -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo 'ROM package was not found.' >&2
            exit 1
          fi

          ZIP_NAME=$(basename "$ZIP_FILE")
          ZIP_SHA256=$(sha256sum "$ZIP_FILE" | cut -d' ' -f1)
          echo "zip_path=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"

      - name: Split ROM package (if >1.5GB)
        id: split_zip
        run: |
          ZIP_PATH="${{ steps.find_zip.outputs.zip_path }}"
          ZIP_SIZE=$(stat -c%s "$ZIP_PATH")
          ZIP_DIR=$(dirname "$ZIP_PATH")
          ZIP_NAME=$(basename "$ZIP_PATH")

          if [ "$ZIP_SIZE" -gt 1500000000 ]; then
            echo 'Splitting ROM package into 1.5GB parts...'
            cd "$ZIP_DIR"
            split -b 1500m "$ZIP_NAME" "$ZIP_NAME.part."

            echo 'files<<EOF' >> "$GITHUB_OUTPUT"
            for file in "${ZIP_NAME}.part."*; do
              echo "$ZIP_DIR/$file" >> "$GITHUB_OUTPUT"
            done
            echo 'EOF' >> "$GITHUB_OUTPUT"
            echo "file_list=$(printf '%s ' "${ZIP_NAME}.part."*)" >> "$GITHUB_OUTPUT"
            echo 'is_split=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ROM package is under 1.5GB; no split is needed.'
            echo 'files<<EOF' >> "$GITHUB_OUTPUT"
            echo "$ZIP_PATH" >> "$GITHUB_OUTPUT"
            echo 'EOF' >> "$GITHUB_OUTPUT"
            echo 'file_list=' >> "$GITHUB_OUTPUT"
            echo 'is_split=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: d2xks-${{ github.run_number }}
          name: ArtisanROM d2xks build ${{ github.run_number }}
          files: ${{ steps.split_zip.outputs.files }}
          body: |
            Build run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Target: d2xks
            SHA256: `${{ steps.find_zip.outputs.zip_sha256 }}`

            ${{ steps.split_zip.outputs.is_split == 'true' && 'The ROM package is split into 1.5GB parts. Download every part, then merge them with: `cat <package>.part.* > <package>`.' || 'The ROM package is provided as a single file.' }}

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d2xks-diagnostics-${{ github.run_id }}
          path: |
            out/target/d2xks/work_dir/configs/**
            out/*.log
          if-no-files-found: ignore
          retention-days: 7
