name: Build ArtisanROM

on:
  workflow_dispatch:
  push:
    branches:
      - d2xks-reproducible-sixteen-clean

permissions:
  contents: read

concurrency:
  group: d2xks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [d2xks]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a --force

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: compiler_cmake

      - name: Restore firmware downloads
        id: firmware-cache
        uses: actions/cache/restore@v4
        with:
          path: out/odin
          key: d2xks-odin-v1-${{ hashFiles('target/d2xks/config.sh', 'unica/configs/essi.sh') }}

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu python-is-python3 python3 wget
          wget -q https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py
          sudo install -m 0755 mkbootimg.py /usr/local/bin/mkbootimg
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh ${{ matrix.target }} && ./scripts/download_fw.sh

      - name: Save firmware downloads
        if: success() && steps.firmware-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/odin
          key: d2xks-odin-v1-${{ hashFiles('target/d2xks/config.sh', 'unica/configs/essi.sh') }}

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh
          ./scripts/internal/validate_prebuilt_resources.sh ${{ matrix.target }}

      - name: Add swapspace
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-space-path: /swapfile
          swap-size-gb: 12
          remove-existing-swap-files: true

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh --force

      - name: Upload ROM package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d2xks-rom-${{ github.run_id }}
          path: out/*.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: d2xks-diagnostics-${{ github.run_id }}
          path: |
            out/target/d2xks/work_dir/configs/**
            out/*.log
          if-no-files-found: ignore
          retention-days: 7
